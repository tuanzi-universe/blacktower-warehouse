<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1eee7">
<link rel="icon" href="data:,">
<title>仓库分区 · 点位图</title>
<style>
:root{--bg:#f1eee7;--panel:#fff;--ink:#1e242b;--muted:#6b7280;--line:#e7e1d6}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,"Segoe UI","Microsoft YaHei",sans-serif}
header{padding:18px 24px 6px}
h1{margin:0;font-size:20px;letter-spacing:.2px}
.sub{margin-top:4px;color:var(--muted);font-size:12px}
.toolbar{display:flex;align-items:center;gap:14px;padding:10px 24px 14px;flex-wrap:wrap}
label.chk{display:flex;align-items:center;gap:6px;color:#4b5563;font-size:13px;cursor:pointer}
button.ghost,a.ghost{display:inline-flex;align-items:center;border:1px solid #d8d3c8;background:#fff;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer;color:#374151;text-decoration:none}
button.ghost:hover,a.ghost:hover{background:#faf8f3}
button.ghost:disabled{opacity:.45;cursor:default;background:#fff}
.vsw{display:inline-flex;align-items:center;border:1px solid #d8d3c8;background:#fff;border-radius:8px;padding:2px;gap:2px}
.vsw button{border:0;background:transparent;border-radius:6px;padding:4px 10px;font:inherit;font-size:12.5px;line-height:1.5;color:#6b7280;cursor:pointer;white-space:nowrap}
.vsw button:hover{background:#faf8f3}
.vsw button.on{background:#1f2937;color:#fff}
.vsw button:disabled{opacity:.45;cursor:default;background:transparent;color:#6b7280}
.vsw button.on:disabled{background:#1f2937;color:#fff}
.verloading svg{opacity:.55;transition:opacity .15s}
details.vdiff{margin-top:6px}
details.vdiff summary{cursor:pointer;color:#6b7280;font-size:12px;padding:2px 0;list-style:none}
details.vdiff summary::-webkit-details-marker{display:none}
details.vdiff summary:before{content:"▸ ";color:#a9a294}
details.vdiff[open] summary:before{content:"▾ "}
details.vdiff[open] summary{margin-bottom:4px}
.hint{margin-left:auto;color:#9ca3af;font-size:12px}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;padding:0 24px 24px;height:calc(100vh - 132px);min-height:560px}
.stage{position:relative;background:var(--panel);border-radius:16px;padding:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 30px rgba(0,0,0,.05)}
.zoombar{position:absolute;top:14px;right:14px;z-index:5;display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.94);border:1px solid #e3ddd1;border-radius:10px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.07)}
.zoombar button{height:28px;min-width:30px;border:0;background:transparent;border-radius:7px;font:inherit;font-size:15px;line-height:1;cursor:pointer;color:#374151}
.zoombar button:hover{background:#f3efe7}
.zoombar button:disabled{opacity:.3;cursor:default;background:transparent}
.zoombar #zreset{width:auto;padding:0 9px;font-size:11.5px}
.zlevel{min-width:38px;text-align:center;font-size:11px;color:#6b7280;font-variant-numeric:tabular-nums}
svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
svg.dragging,svg.dragging *{cursor:grabbing!important}
aside{background:var(--panel);border-radius:16px;padding:18px;overflow:auto;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 30px rgba(0,0,0,.05)}
aside h2{margin:0 0 6px;font-size:18px}
aside h3{margin:18px 0 8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.kpi{background:#f7f4ed;border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:4px}
.lrow{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer}
.lrow:hover{background:#f7f4ed}
.lrow.on{background:#f1ece2}
.sw{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.lname{flex:1;min-width:0}
.lname b{font-weight:600}
.lname small{display:block;color:var(--muted);font-size:11px}
.lnum{font-variant-numeric:tabular-nums;color:#4b5563;font-size:11.5px;white-space:nowrap}
.note{color:#8b857a;font-size:12px;margin-top:14px}
.sidehead{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-size:10.5px;color:#8b857a;text-transform:uppercase;letter-spacing:.08em}
.sidehead:after{content:"";flex:1;height:1px;background:#eee8dd}
.rows{display:flex;flex-direction:column;gap:1px}
.row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:12.5px}
.row:hover{background:#f7f4ed}
.row.on{background:#f1ece2}
.row .s{width:22px;color:#9ca3af;font-variant-numeric:tabular-nums;font-size:11px}
.row .i{width:16px;height:16px;image-rendering:pixelated;object-fit:contain;flex:0 0 auto}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .c{color:#9ca3af;font-size:10.5px;font-variant-numeric:tabular-nums}
.big{font-size:20px;font-weight:650;margin:8px 0 2px}
.meta{color:var(--muted);font-size:12px;margin-bottom:10px}
.back{border:0;background:none;padding:0;color:#6b7280;cursor:pointer;font:inherit;font-size:12px;margin-bottom:8px}
.tip{position:fixed;left:0;top:0;background:#151a20;color:#fff;padding:8px 10px;border-radius:8px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .08s;z-index:99;max-width:300px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tip .t1{color:#9fb0c3;font-size:10.5px;margin-bottom:2px}
.tip .t2{font-weight:600}
.tip .t3{color:#9ca3af;font-size:10.5px;margin-top:2px;word-break:break-all}
.tex{image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none;transition:opacity .12s}
.tex.dim{opacity:.08}
.slot{cursor:pointer;transition:opacity .12s}
.slot.dim{opacity:.1}
.slot.sel{stroke:#111!important;stroke-width:1.2!important}
.alabel{cursor:pointer;transition:opacity .12s}
.alabel text{paint-order:stroke;stroke:#fdfcf9;stroke-width:3.2px;stroke-linejoin:round}
.alabel:hover text{stroke-width:4.2px}
.alabel.dim{opacity:.22}
.badge{pointer-events:none;transition:opacity .12s}
.badge.dim{opacity:.08}
.nametext{pointer-events:none;transition:opacity .12s}
.nametext.dim{opacity:.08}
.err{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:#fdecea;color:#8a1c1c;border:1px solid #f5c2c0;border-radius:10px;padding:9px 14px;font-size:12.5px;z-index:6;max-width:82%;box-shadow:0 8px 24px rgba(0,0,0,.08);line-height:1.6}
.err button{margin-left:8px;border:1px solid #e3aaa6;background:#fff;border-radius:6px;padding:2px 8px;font:inherit;font-size:11.5px;cursor:pointer}
.vlist{max-height:320px;overflow:auto;border:1px solid #eee8dd;border-radius:8px;margin-top:8px}
.vrow{display:flex;align-items:center;gap:8px;padding:4px 8px;font-size:12px;border-bottom:1px solid #f5f1e9}
.vrow:last-child{border-bottom:0}
.vrow .v1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow .v2{color:#a9a294;font-size:10.5px;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.tag{background:#f1ece2;border-radius:999px;padding:3px 9px;font-size:11.5px;color:#4b5563}
.tag.enchant{background:#f6ecd9;color:#8a5a16}
.tag.potion{background:#eee6f7;color:#5b3a86}
.tag.merged{background:#e8f2e6;color:#3f6b3a}
.special{margin-top:8px;font-size:12px;color:#5f5a52;line-height:1.7}
.special b{color:#374151}
.search-overlay{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;padding:10vh 24px 40px;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:auto}
.search-overlay.on{display:flex}
body.search-open{overflow:hidden}
.search-panel{width:min(780px,94vw);display:flex;flex-direction:column;gap:12px}
.search-box{display:flex;gap:8px;align-items:center}
.search-box input{flex:1;height:50px;border:1px solid #d8d3c8;background:rgba(255,255,255,.96);border-radius:14px;padding:0 16px;font:16px/1.4 ui-sans-serif,system-ui,"Segoe UI","Microsoft YaHei",sans-serif;color:#111;outline:none;box-shadow:0 10px 30px rgba(0,0,0,.10)}
.search-box input:focus{border-color:#9ca3af;box-shadow:0 10px 34px rgba(0,0,0,.14)}
.search-close{height:50px;border:1px solid #d8d3c8;background:rgba(255,255,255,.96);border-radius:14px;padding:0 16px;font:inherit;cursor:pointer;color:#4b5563}
.search-close:hover{background:#faf8f3}
.search-meta{font-size:12px;color:#6b7280;padding:0 4px;min-height:16px}
.search-results{background:rgba(255,255,255,.95);border:1px solid #e7e1d6;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.14);overflow:auto;max-height:56vh}
.srow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #f1ece2;cursor:pointer}
.srow:last-child{border-bottom:0}
.srow:hover,.srow.on{background:#f7f4ed}
.srow .si{width:24px;height:24px;image-rendering:pixelated;object-fit:contain;flex:0 0 auto}
.srow .sm{flex:1;min-width:0}
.srow .sm b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sm small{display:block;color:#8b857a;font-size:11px;margin-top:1px}
.srow .ss{color:#9a9488;font-size:11px;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow mark{background:#fde68a;color:inherit;border-radius:2px;padding:0 1px}
.search-empty{padding:18px;text-align:center;color:#8b857a;font-size:12.5px}
@media(max-width:980px){main{grid-template-columns:1fr;height:auto}aside{max-height:none}.stage{height:74vh}.hint{display:none}}

/* ---------- 移动端 ---------- */
.sheet{display:contents}
.sheetbar{display:none}
.touchhint{display:none}
.zoombar .zreset-ico{display:none}
@media (max-width:860px), (max-height:520px) and (pointer:coarse){
  body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
  header{flex:0 0 auto;padding:10px calc(14px + env(safe-area-inset-right)) 2px calc(14px + env(safe-area-inset-left))}
  h1{font-size:17px}
  .sub{margin-top:2px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toolbar{flex:0 0 auto;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:8px;padding:8px calc(10px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left));scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .toolbar>*{flex:0 0 auto}
  .vsw{height:38px;padding:3px;border-radius:999px;background:#fff}
  .vsw button{height:30px;padding:0 11px;border-radius:999px;font-size:12.5px}
  label.chk{min-height:38px;padding:0 12px;border:1px solid #ddd7cb;border-radius:999px;background:#fff;font-size:13px;gap:7px;white-space:nowrap}
  label.chk input{width:15px;height:15px;margin:0;accent-color:#4b5563}
  button.ghost,a.ghost{min-height:38px;padding:0 14px;border-radius:999px;font-size:13px;white-space:nowrap}
  .toolbar #searchBtn{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(72px + env(safe-area-inset-bottom));z-index:40;height:46px;padding:0 18px;border-radius:999px;font-size:14px;border-color:#1f2937;background:#1f2937;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.22)}
  .toolbar #reset{display:none}
  .hint{display:none}

  main{display:flex;flex:1 1 auto;min-height:0;padding:0 calc(8px + env(safe-area-inset-right)) calc(68px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}
  .stage{flex:1 1 auto;height:auto;min-height:0;padding:4px;border-radius:14px}
  .err{top:8px;max-width:94%;font-size:12px;line-height:1.5}

  .zoombar{top:8px;right:8px;flex-direction:column;gap:2px;padding:3px;border-radius:12px}
  .zoombar button{height:38px;min-width:38px;font-size:17px;border-radius:9px}
  .zoombar #zreset{width:38px;padding:0;font-size:15px}
  .zoombar #zreset .zreset-txt{display:none}
  .zoombar .zreset-ico{display:inline}
  .zlevel{min-width:0;padding:1px 0;font-size:10.5px}

  .touchhint{display:block;position:absolute;left:10px;bottom:10px;z-index:4;background:rgba(21,26,32,.7);color:#fff;font-size:11px;padding:6px 10px;border-radius:999px;pointer-events:none;transition:opacity .5s}
  .touchhint.off{opacity:0}

  /* 底部面板 */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;display:flex;flex-direction:column;background:var(--panel);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);max-height:calc(60px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);overflow:hidden;transition:max-height .28s cubic-bezier(.32,.72,.25,1)}
  .sheet.open{max-height:calc(58dvh + env(safe-area-inset-bottom))}
  .sheetbar{display:flex;align-items:center;gap:8px;flex:0 0 60px;height:60px;padding:8px calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left));position:relative;cursor:pointer;-webkit-user-select:none;user-select:none}
  .sheetbar:after{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:#ded7c9}
  .sheetbar .chev{flex:0 0 auto;margin-top:6px;color:#a9a294;font-size:10px;line-height:1;transition:transform .24s}
  .sheet.open .sheetbar .chev{transform:rotate(180deg)}
  .sheetbar .sbar-title{margin-top:6px;min-width:0;font-weight:650;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheetbar .sbar-meta{margin:6px 0 0 auto;max-width:45%;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheet aside{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:0;box-shadow:none;background:transparent;padding:2px calc(16px + env(safe-area-inset-right)) 20px calc(16px + env(safe-area-inset-left))}

  aside h2{display:none}
  aside h3{margin:16px 0 6px}
  .kpi b{font-size:18px}
  .lrow{min-height:46px;padding:8px}
  .row{min-height:46px;padding:6px 8px;font-size:13px}
  .vlist{max-height:none}
  .back{padding:10px 0;font-size:13px}
  .special{font-size:12px}

  /* 搜索 */
  .search-overlay{padding:calc(10px + env(safe-area-inset-top)) 10px 0;overflow:hidden}
  .search-panel{width:100%;height:100%;min-height:0;gap:10px}
  .search-box{flex:0 0 auto}
  .search-box input{height:46px;border-radius:12px;font-size:16px}
  .search-close{height:46px;border-radius:12px;padding:0 14px}
  .search-meta{min-height:0}
  .search-results{flex:1 1 auto;min-height:0;max-height:none;border-radius:12px;margin-bottom:calc(10px + env(safe-area-inset-bottom))}
  .srow{display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:10px;row-gap:2px;align-content:center;padding:10px 12px;min-height:52px}
  .srow .si{grid-row:1/span 2;align-self:center;width:24px;height:24px;margin:0}
  .srow .sm{grid-column:2}
  .srow .ss{grid-column:2;max-width:none;font-size:11px}
}
@media(max-width:390px){
  h1{font-size:16px}
  .sub{font-size:10.5px}
  .sheetbar .sbar-meta{max-width:36%}
  label.chk{padding:0 9px;font-size:12.5px;gap:5px}
}
@media (max-width:860px) and (max-height:700px), (max-height:520px) and (pointer:coarse){
  .zoombar button{height:32px;min-width:32px;font-size:15px}
  .zoombar #zreset{width:32px}
  .zlevel{font-size:10px}
  main:has(.sheet.open) .zoombar{display:none}
}
@media (max-height:520px) and (pointer:coarse){
  header{padding-top:6px}
  .sub{display:none}
  h1{font-size:15px}
  .toolbar{padding-top:4px;padding-bottom:6px}
  .toolbar #searchBtn{height:40px;font-size:13px;bottom:calc(66px + env(safe-area-inset-bottom))}
  .sheet.open{max-height:calc(62dvh + env(safe-area-inset-bottom))}
}

/* ---------- 数据导入 / 导出 ---------- */
.data-overlay{position:fixed;inset:0;z-index:210;display:none;align-items:flex-start;justify-content:center;padding:9vh 24px 40px;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:auto}
.data-overlay.on{display:flex}
body.data-open{overflow:hidden}
.data-panel{width:min(680px,94vw);background:#fff;border:1px solid #e7e1d6;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.16);padding:18px;display:flex;flex-direction:column;gap:12px}
.data-head{display:flex;align-items:center;gap:10px}
.data-head h2{margin:0;font-size:18px;flex:1}
.data-close{border:1px solid #d8d3c8;background:#fff;border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px;color:#4b5563;cursor:pointer}
.data-close:hover{background:#faf8f3}
.data-source{font-size:12px;color:#6b7280;word-break:break-all}
.data-stats{font-size:12px;color:#4b5563}
.data-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.data-action{border:1px solid #d8d3c8;background:#fff;border-radius:9px;padding:10px 12px;font:inherit;font-size:13px;color:#374151;cursor:pointer;text-align:center}
.data-action:hover{background:#faf8f3}
.data-action.primary{background:#1f2937;border-color:#1f2937;color:#fff}
.data-action.primary:hover{background:#111827}
.data-action.danger{color:#8a1c1c;border-color:#e3aaa6;background:#fff7f6}
.data-action.danger:hover{background:#fdecea}
.data-action.data-wide{grid-column:1/-1}
.data-action:disabled{opacity:.45;cursor:default;background:#fff;color:#6b7280;border-color:#e3ddd1}
.data-action.primary:disabled{background:#1f2937;color:#fff}
.data-note{font-size:12px;color:#8b857a;line-height:1.65}
.data-note b{color:#4b5563;font-weight:600}
.data-message{font-size:12.5px;line-height:1.6;color:#374151;white-space:pre-wrap;min-height:18px}
.data-list{max-height:38vh;overflow:auto;border:1px solid #eee8dd;border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.55;background:#fcfbf8}
.data-list .item{padding:3px 0;border-bottom:1px solid #f1ece2;word-break:break-word}
.data-list .item:last-child{border-bottom:0}
.data-list .item.err{color:#8a1c1c}
.data-list .item.warn{color:#8a5a16}
.data-foot{display:flex;justify-content:flex-end;min-height:28px}
.data-copy{border:1px solid #d8d3c8;background:#fff;border-radius:8px;padding:5px 11px;font:inherit;font-size:12px;color:#4b5563;cursor:pointer}
.data-copy:hover{background:#faf8f3}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);z-index:220;background:#151a20;color:#fff;padding:9px 14px;border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:860px), (max-height:520px) and (pointer:coarse){
  .data-overlay{padding:0;align-items:stretch}
  .data-panel{width:100%;min-height:100%;border-radius:0;border:0;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));overflow:auto;gap:10px}
  .data-actions{grid-template-columns:1fr}
  .data-list{max-height:none;flex:1 1 auto}
  .data-foot{flex:0 0 auto}
  .toast{bottom:calc(78px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<header>
  <h1>仓库分区 · 点位图</h1>
  <div class="sub" id="sub">正在加载点位…</div>
</header>
<div class="toolbar">
  <div class="vsw" id="verSwitch" role="group" aria-label="版本切换">

      <button id="zout" title="缩小 (-)">−</button>

<script>
const SLOTS = __SLOTS__;
const TEX = __TEX__;
const ITEM_CN = __ITEM_CN__;
const AREAS = __AREAS__;
const IMPORTED_VER = 'imported';
const DATA_CACHE_KEY = 'warehouse-partition.imported-view.v1';
const LEGACY_DATA_CACHE_KEY = 'warehouse-partition.imported-v2.v1';
const DATA_CACHE_SCHEMA = 1;
const MAX_IMPORT_BYTES = 20 * 1024 * 1024;

const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('plan');
const tip = document.getElementById('tip');
const side = document.getElementById('side');
const searchOverlay = document.getElementById('searchOverlay');
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
const searchMeta = document.getElementById('searchMeta');
const searchBtn = document.getElementById('searchBtn');
const sheet = document.getElementById('sheet');
const sheetBar = document.getElementById('sheetBar');
const sheetTitle = document.getElementById('sheetTitle');
const sheetMeta = document.getElementById('sheetMeta');
const dataBtn = document.getElementById('dataBtn');
const dataOverlay = document.getElementById('dataOverlay');
const dataClose = document.getElementById('dataClose');
const dataSource = document.getElementById('dataSource');
const dataStats = document.getElementById('dataStats');
const dataMessage = document.getElementById('dataMessage');
const dataList = document.getElementById('dataList');
const dataCopy = document.getElementById('copyData');
const exportXlsxBtn = document.getElementById('exportXlsx');
const exportJsonBtn = document.getElementById('exportJson');
const importBtn = document.getElementById('importBtn');
const importFile = document.getElementById('importFile');
const restoreDiskBtn = document.getElementById('restoreDisk');
const deleteImportedBtn = document.getElementById('deleteImported');
const toastEl = document.getElementById('toast');
const verSwitch = document.getElementById('verSwitch');
const verButtons = [...verSwitch.querySelectorAll('button[data-ver]')];
const VER_FILES = {v1:'../data/points/itemsorter-points-v1.json', v2:'../data/points/itemsorter-points-v2.json', imported:'导入视图（浏览器暂存）'};
const VER_NAMES = {v1:'v1 冻结快照', v2:'v2 工作版本', imported:'导入视图'};
const phoneMQ = window.matchMedia('(max-width:860px),(max-height:520px) and (pointer:coarse)');
const SHORT_MQ = window.matchMedia('(max-height:520px) and (pointer:coarse)');
const CAN_HOVER = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
const MINX = 5145, MAXX = 5318, MINZ = -37799, MAXZ = -37626, M = 14, S = 5;
const W = (MAXX - MINX + 1 + 2 * M) * S;
const H = (MAXZ - MINZ + 1 + 2 * M) * S;
const px = x => (x - MINX + M) * S;
const py = z => (z - MINZ + M) * S;

const slots = SLOTS.map(d => ({a:d[0], s:d[1], i:d[2], bx:d[3], bz:d[4], px:d[5], ptY:d[6], pz:d[7], yaw:d[8], pitch:d[9] ?? 0}));
const areaSlots = {A:[],B:[],C:[],D:[],E:[],F:[],G:[],H:[]};
for (const s of slots) areaSlots[s.a].push(s);
const slotByPoint = new Map();
for (const s of slots) slotByPoint.set(s.px.toFixed(2) + ',' + s.pz.toFixed(2), s);
const SLOT_POINTS = slots.map(s => ({area:s.a, side:s.s, slot:s.i, x:s.px, y:s.ptY, z:s.pz, yaw:s.yaw, pitch:s.pitch}));
const IO = (window.PointsIO && window.PointsIO.create({slots:SLOT_POINTS, itemCn:ITEM_CN, areas:AREAS})) || null;

let units = [];
let unitBySlot = new Map();
let ruleCount = 0;
let specialPoints = {};
let currentVer = 'v2';
function areaTheme(a) {
  const info = AREAS[a];
  if (!info) return '';
  return currentVer === 'v1' && info.themeV1 ? info.themeV1 : info.theme;
}
let loadedVer = null;
let loadingVer = null;
const versionData = new Map();
let v1ByLabel = new Map();
let versionDiff = null;
let searchIndex = [];
let searchHitsList = [];
let searchActive = -1;
let selectedArea = null, selectedUnit = null, selectedSlot = null;
let showTextures = true, hideEmpty = false, showPoints = false;
let importedView = null;
let dataBusy = false;
let lastDataListText = '';
let toastTimer = null;

function add(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}
function itemOfMatch(m) {
  if (m.name) return m.name.replace(/^minecraft:/, '');
  if (m.enchantments) return 'enchanted_book';
  if (m.effects || m.potionId !== undefined) return 'potion';
  return '';
}
function unitType(rules, label) {
  if (rules.some(r => r.match.enchantments) || /^附魔/.test(label || '')) return 'enchant';
  if (rules.some(r => r.match.effects || r.match.potionId !== undefined) || /^药水/.test(label || '')) return 'potion';
  return 'item';
}
function texPath(id) {
  const t = TEX[id];
  if (!t) return null;
  return t.item || t.block;
}
function iconItem(u) {
  return u.items.find(id => texPath(id)) || null;
}
function texFor(u) {
  const id = iconItem(u);
  return id ? texPath(id) : null;
}
function isMerged(u) {
  return u.items.length > 1;
}
const FORM_CN = {potion:'普通药水', splash_potion:'喷溅药水', lingering_potion:'滞留药水', tipped_arrow:'药水箭'};
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V'];
function variantLabel(m, u) {
  if (m.enchantments) {
    const [, lv] = Object.entries(m.enchantments)[0];
    return `${(u.label || '').replace(/^附魔·/, '')} ${ROMAN[lv] || lv}`;
  }
  if (m.effects) {
    const form = (m.name || '').replace(/^minecraft:/, '');
    return `${FORM_CN[form] || form} · ${(u.label || '').replace(/^药水·/, '')}`;
  }
  if (m.potionId !== undefined) return `${u.label} · id ${m.potionId}`;
  if (m.name) {
    const id = m.name.replace(/^minecraft:/, '');
    return ITEM_CN[id] || id;
  }
  return '兜底';
}
function variantSub(m, u) {
  if (m.enchantments) return Object.keys(m.enchantments)[0];
  if (m.effects) return `${(m.name || '').replace(/^minecraft:/, '')} · effect ${m.effects.join(',')}`;
  if (m.potionId !== undefined) return m.name || 'potion';
  if (m.name) return m.name.replace(/^minecraft:/, '');
  return '';
}

function computeUnits(rules) {
  const groups = new Map();
  for (const r of rules) {
    const p = r.point;
    const key = `${p.x},${p.y},${p.z},${p.yaw},${p.pitch}`;
    if (!groups.has(key)) groups.set(key, {p, rules: []});
    groups.get(key).rules.push(r);
  }
  const list = [...groups.values()].map(g => {
    const p = g.p;
    const slot = slotByPoint.get(Number(p.x).toFixed(2) + ',' + Number(p.z).toFixed(2));
    const firstItem = itemOfMatch(g.rules[0].match);
    return {
      p, rules: g.rules, area: p.area || (slot ? slot.a : ''), side: p.side || (slot ? slot.s : ''),
      slot: slot ? slot.i : null, slotRef: slot || null,
      label: p.label || firstItem || '未命名',
      firstItem, type: unitType(g.rules, p.label), count: g.rules.length,
      items: [...new Set(g.rules.map(r => itemOfMatch(r.match)).filter(Boolean))],
    };
  }).sort((a, b) => (a.area + a.side).localeCompare(b.area + b.side) || (a.slot || 99) - (b.slot || 99));
  const bySlot = new Map();
  for (const u of list) if (u.slot) bySlot.set(`${u.area}-${u.side}-${u.slot}`, u);
  return {units: list, bySlot, ruleCount: rules.length};
}
function buildUnits(rules) {
  const r = computeUnits(rules);
  units = r.units;
  unitBySlot = r.bySlot;
  ruleCount = r.ruleCount;
  buildSearchIndex();
}
function unitSlotText(u) {
  return `${u.area}-${u.side} #${u.slot ?? '?'}`;
}
function diffUnits(base, next) {
  const b = new Map(base.map(u => [u.label, u]));
  const n = new Map(next.map(u => [u.label, u]));
  const moved = [], added = [], removed = [];
  for (const u of next) {
    const o = b.get(u.label);
    if (!o) added.push(u);
    else if (o.area !== u.area || o.side !== u.side || o.slot !== u.slot) moved.push({u, b: o});
  }
  for (const o of base) if (!n.has(o.label)) removed.push(o);
  moved.sort((x, y) => unitSlotText(x.u).localeCompare(unitSlotText(y.u)));
  added.sort((x, y) => unitSlotText(x).localeCompare(unitSlotText(y)));
  removed.sort((x, y) => unitSlotText(x).localeCompare(unitSlotText(y)));
  return {moved, added, removed};
}
function recomputeDiff() {
  versionDiff = null;
  v1ByLabel = new Map();
  if (!versionData.has('v1')) return;
  const base = computeUnits(versionData.get('v1').items).units;
  v1ByLabel = new Map(base.map(u => [u.label, u]));
  if (currentVer === 'v1') return;
  const current = versionData.get(currentVer);
  if (!current || !Array.isArray(current.items)) return;
  const next = computeUnits(current.items).units;
  versionDiff = diffUnits(base, next);
}
function diffCount() {
  if (!versionDiff) return 0;
  return versionDiff.moved.length + versionDiff.added.length + versionDiff.removed.length;
}
function diffSummaryText() {
  if (currentVer === 'v1') return '基准版本';
  if (!versionData.has('v1')) return 'v1 未加载';
  if (!versionDiff) return '对比 v1 —';
  const n = diffCount();
  if (!n) return '与 v1 相同';
  return `相对 v1：移动 ${versionDiff.moved.length} · 新增 ${versionDiff.added.length} · 移除 ${versionDiff.removed.length}`;
}

function buildSearchIndex() {
  searchIndex = units.map(u => {
    const names = u.items.map(i => ITEM_CN[i] || i);
    const ench = [];
    for (const r of u.rules) {
      if (r.match.enchantments) ench.push(...Object.keys(r.match.enchantments));
    }
    const text = [u.label, areaTheme(u.area), ...names, ...u.items, ...ench].join(' ').toLowerCase();
    return {u, names, text, ench};
  });
}

function escapeRegExp(s) {
  return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function highlightText(s, tokens) {
  let out = escapeHtml(s);
  for (const t of tokens) {
    if (!t) continue;
    out = out.replace(new RegExp('(' + escapeRegExp(escapeHtml(t)) + ')', 'gi'), '<mark>$1</mark>');
  }
  return out;
}
function scoreText(text, q) {
  if (!text) return -1;
  if (text === q) return 100;
  if (text.startsWith(q)) return 82;
  if (text.includes(q)) return 58;
  return -1;
}
function scoreUnit(entry, q) {
  const tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!tokens.length) return -1;
  const u = entry.u;
  let total = 0;
  for (const t of tokens) {
    let best = scoreText(u.label.toLowerCase(), t) * 1.35;
    for (const id of u.items) {
      best = Math.max(best, scoreText((ITEM_CN[id] || '').toLowerCase(), t), scoreText(id.toLowerCase(), t) * 0.95);
    }
    for (const k of entry.ench) best = Math.max(best, scoreText(k.toLowerCase(), t) * 0.9);
    best = Math.max(best, scoreText(areaTheme(u.area).toLowerCase(), t) * 0.6);
    if (best < 0) return -1;
    total += best;
  }
  return total - (u.slot || 0) * 0.01;
}
function matchedNames(entry, tokens) {
  const hits = [];
  for (const id of entry.u.items) {
    const cn = ITEM_CN[id] || id;
    if (tokens.some(t => cn.toLowerCase().includes(t) || id.toLowerCase().includes(t))) hits.push(cn);
  }
  return [...new Set(hits)].slice(0, 6);
}
function renderSearch(value) {
  const q = value.trim().replace(/^minecraft:/i, '');
  const tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
  searchActive = -1;
  if (!q) {
    searchHitsList = [];
    searchMeta.textContent = '输入物品名、物品 ID 或单元名；空格分隔多个关键词';
    searchResults.innerHTML = '';
    return;
  }
  const scored = searchIndex
    .map(s => ({s, score: scoreUnit(s, q)}))
    .filter(x => x.score >= 0)
    .sort((a, b) => b.score - a.score
      || (a.s.u.area + a.s.u.side).localeCompare(b.s.u.area + b.s.u.side)
      || (a.s.u.slot || 99) - (b.s.u.slot || 99))
    .slice(0, 60);
  searchHitsList = scored.map(x => x.s.u);
  searchMeta.textContent = scored.length ? `找到 ${scored.length} 个存储单元` : '没有匹配的存储单元';
  if (!scored.length) {
    searchResults.innerHTML = '<div class="search-empty">没有匹配项</div>';
    return;
  }
  searchResults.innerHTML = scored.map(({s}, i) => {
    const u = s.u;
    const icon = texFor(u);
    const hits = matchedNames(s, tokens);
    const snip = (hits.length ? hits : u.items.slice(0, 4).map(id => ITEM_CN[id] || id))
      .map(n => highlightText(n, tokens)).join(' / ');
    const tag = u.type === 'enchant' ? '附魔' : u.type === 'potion' ? '药水' : '物品';
    return `<div class="srow" data-idx="${i}">
      ${icon ? `<img class="si" src="${icon}" alt="">` : ''}
      <span class="sm"><b>${highlightText(u.label, tokens)}</b><small>${u.area} · ${u.side} #${u.slot || '-'} · ${tag}${isMerged(u) ? ' · 合并 ' + u.items.length + ' 项' : ''} · ${u.count} 条规则</small></span>
      <span class="ss">${snip}</span>
    </div>`;
  }).join('');
}
function setSearchActive(i) {
  const rows = [...searchResults.querySelectorAll('.srow')];
  if (!rows.length) return;
  searchActive = Math.max(0, Math.min(rows.length - 1, i));
  rows.forEach((r, j) => r.classList.toggle('on', j === searchActive));
  rows[searchActive].scrollIntoView({block:'nearest'});
}
function openSearch() {
  if (!units.length) return;
  hideTip();
  searchOverlay.classList.add('on');
  document.body.classList.add('search-open');
  searchInput.value = '';
  renderSearch('');
  requestAnimationFrame(() => searchInput.focus());
}
function closeSearch() {
  searchOverlay.classList.remove('on');
  document.body.classList.remove('search-open');
  searchInput.blur();
  hideTip();
}
function chooseSearch(idx) {
  const u = searchHitsList[idx];
  if (!u) return;
  closeSearch();
  selectUnit(u);
  focusArea(u.area);
}

// ---------- 数据导入 / 导出 ----------
function formatStamp(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return String(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function dataSourceText() {
  if (!loadedVer) return '等待点位数据加载…';
  if (currentVer === IMPORTED_VER) {
    const m = importedView?.meta || {};
    return `导入视图 · ${m.fileName || '文件'}（${formatStamp(m.importedAt)}）`;
  }
  return currentVer === 'v2' ? 'v2 · 磁盘 itemsorter-points-v2.json' : 'v1 · 磁盘 itemsorter-points-v1.json';
}
function updateDataUI() {
  if (!dataSource) return;
  dataSource.textContent = dataSourceText();
  if (!IO) {
    dataStats.textContent = '导入导出组件未加载（assets/points-io.js）';
  } else if (!window.XLSX) {
    dataStats.textContent = `${units.length} 单元 / ${ruleCount} 规则；Excel 组件未加载，JSON 可用`;
  } else {
    dataStats.textContent = `${units.length} 单元 / ${ruleCount} 规则 / 占用 ${units.filter(u => u.slot).length} 格`;
  }
  const busy = dataBusy || !!loadingVer;
  exportXlsxBtn.disabled = busy || !IO || !window.XLSX || !loadedVer;
  exportJsonBtn.disabled = busy || !IO || !loadedVer;
  importBtn.disabled = busy || !IO;
  restoreDiskBtn.disabled = busy || !loadedVer;
  restoreDiskBtn.textContent = '重新读取 v2';
  deleteImportedBtn.hidden = !importedView;
  deleteImportedBtn.disabled = busy || !importedView;
  deleteImportedBtn.title = importedView
    ? `删除导入视图：${importedView.meta?.fileName || '文件'}（${formatStamp(importedView.meta?.importedAt)}）`
    : '';
  if (!loadedVer) dataStats.textContent = '正在加载点位…';
}
function openData() {
  hideTip();
  closeSearch();
  renderDataMessages({});
  dataOverlay.classList.add('on');
  document.body.classList.add('data-open');
  updateDataUI();
  requestAnimationFrame(() => dataClose.focus());
}
function closeData() {
  dataOverlay.classList.remove('on');
  document.body.classList.remove('data-open');
  if (dataBtn) dataBtn.focus();
}
function setDataBusy(on) {
  dataBusy = on;
  updateDataUI();
}
function showToast(text) {
  if (!toastEl) return;
  if (toastTimer) clearTimeout(toastTimer);
  toastEl.textContent = text;
  toastEl.classList.add('on');
  toastTimer = setTimeout(() => { toastEl.classList.remove('on'); toastTimer = null; }, 3600);
}
function renderDataMessages({ message = '', errors = [], warnings = [] } = {}) {
  if (!dataMessage) return;
  dataMessage.textContent = message;
  const items = [
    ...errors.map(e => ({ type: 'err', path: e.path || '', message: e.message || String(e) })),
    ...warnings.map(e => ({ type: 'warn', path: e.path || '', message: e.message || String(e) })),
  ];
  if (!items.length) {
    dataList.hidden = true;

const FULL = {x:0, y:0, w:W, h:H};

      const href = texFor(u);
      if (href) {
        const im = add('image', {x:px(s.bx) + S * .08, y:py(s.bz) + S * .08, width:S * .84, height:S * .84, href, preserveAspectRatio:'xMidYMid meet', class:'tex'}, gTex);
        im.style.imageRendering = 'pixelated';
        im.addEventListener('error', () => { im.style.display = 'none'; });
        u.texEl = im;
      }
      if (!href) {
        const raw = String(ITEM_CN[u.items[0]] || u.items[0] || u.label || '').trim();
        const chars = Array.from(raw).slice(0, 4);
        const labels = [chars.slice(0, 2).join(''), chars.slice(2, 4).join('')].filter(Boolean);
        const fsz = S * .28, step = S * .34;
        const start = py(s.bz) + (S - (labels.length - 1) * step) / 2 + fsz * .35;
        const g = add('g', {class:'nametext'}, gNames);
        labels.forEach((label, i) => {
          const t = add('text', {
            x: px(s.bx) + S / 2, y: start + i * step, 'text-anchor':'middle', 'font-size':fsz,
            fill:'#2b2b2b', stroke:'#fff', 'stroke-width':S * .045, 'paint-order':'stroke',

  const LP = {
    A:[5231.5, -37805], B:[5291, -37758], C:[5291, -37726], D:[5291, -37694],
    E:[5231.5, -37619], F:[5172, -37694], G:[5172, -37726], H:[5172, -37758]

    const un = units.filter(u => u.area === a).length;
    l3.textContent = `${un} 单元 / 110 格`;
    g.addEventListener('click', e => { e.stopPropagation(); if (tapSuppressed()) return; selectArea(a); });
    g.addEventListener('mouseenter', () => { if (!selectedArea) highlightArea(a, true); });
    g.addEventListener('mouseleave', () => { if (!selectedArea) highlightArea(null, false); });
    labelRefs[a] = {g, l1, l2, l3};
  }

  const comp = add('g', {transform:'translate(24,42)'});
  add('path', {d:'M0 17 L0 0 M-4.5 5.8 L0 0 L4.5 5.8', fill:'none', stroke:'#8b857a', 'stroke-width':1.2, 'stroke-linecap':'round', 'stroke-linejoin':'round'}, comp);
  const nt = add('text', {x:0, y:-8, 'text-anchor':'middle', 'font-size':10, 'font-weight':700, fill:'#8b857a'}, comp);

  selRing = add('circle', {r:S * 1.55, fill:'none', stroke:'#111', 'stroke-width':1.3, 'pointer-events':'none', display:'none'});
  drawStation();
}

function drawStation() {
  for (const u of units) {
    const x = px(u.p.x), y = py(u.p.z);
    const g = add('g', {}, gStation);
    add('circle', {cx:x, cy:y, r:1.1, fill:'#111', 'fill-opacity':.55}, g);
    const rad = (Number(u.p.yaw) || 0) * Math.PI / 180;
    add('line', {x1:x, y1:y, x2:x + Math.sin(rad) * 3.2, y2:y - Math.cos(rad) * 3.2, stroke:'#111', 'stroke-opacity':.45, 'stroke-width':.7}, g);
  }
  const names = {collector:'接收点', trash:'垃圾点', minecart:'矿车点', ready:'准备点'};
  for (const [k, cn] of Object.entries(names)) {
    const p = specialPoints[k];
    if (!p) continue;
    const x = px(p.x), y = py(p.z);
    const g = add('g', {}, gStation);
    add('rect', {x:x - 2, y:y - 2, width:4, height:4, fill:'#111', 'fill-opacity':.6, transform:`rotate(45 ${x} ${y})`}, g);
    add('text', {x:x + 4, y:y - 3, 'font-size':8.5, fill:'#6b7280'}, g).textContent = cn;
  }
}

function paint() {
  for (const s of slots) {
    const u = unitBySlot.get(`${s.a}-${s.s}-${s.i}`);
    const dim = !!selectedArea && s.a !== selectedArea;

async function fetchVersion(ver, opts = {}) {
  const force = !!opts.force;
  const disk = !!opts.disk;
  if (ver === IMPORTED_VER) {
    if (!importedView) throw new Error('导入视图不存在');
    versionData.set(IMPORTED_VER, importedView.data);
    return importedView.data;
  }
  if (!force && !disk && versionData.has(ver)) return versionData.get(ver);
  const res = await fetch(VER_FILES[ver], {cache:'no-store'});
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (!data || !Array.isArray(data.items)) throw new Error('items 不是数组');
  versionData.set(ver, data);
  return data;
}
async function ensureV1() {
  if (versionData.has('v1')) return;
  try { await fetchVersion('v1'); } catch (_) { /* v1 缺失时仅关闭对比 */ }
}

  const keepUnit = prevSel ? units.find(u => u.label === prevSel) : null;
  if (keepUnit) {
    selectedUnit = keepUnit;
    selectedArea = keepUnit.area;
    selectedSlot = keepUnit.slotRef;
  } else {
    selectedUnit = null;
    selectedArea = prevArea;
    selectedSlot = null;
  }
  paint();
  renderSide();
  updateSub();
  updateDataUI();
}
async function loadVersion(ver, opts = {}) {
  if (loadingVer) return false;
  loadingVer = ver;
  setVerBusy(true);
  document.getElementById('err').style.display = 'none';
  const prevSel = selectedUnit ? selectedUnit.label : null;
  const prevArea = selectedArea;
  const keepView = opts.keepView !== false && loadedVer !== null;
  try {
    const data = await fetchVersion(ver, {force: ver === 'v2', disk: !!opts.disk});
    if (ver === 'v2' || ver === IMPORTED_VER) await ensureV1();
    currentVer = ver;
    loadedVer = ver;
    applyPointsData(data, {prevSel, prevArea, keepView});
    return true;
  } catch (e) {
    if (ver === 'v2' && importedView && !loadedVer) {
      versionData.set(IMPORTED_VER, importedView.data);
      currentVer = IMPORTED_VER;
      loadedVer = IMPORTED_VER;
      applyPointsData(importedView.data, {keepView: false});
    }
    showLoadError(ver, e);
    return false;
  } finally {
    loadingVer = null;
    setVerBusy(false);
  }
}
verSwitch.addEventListener('click', e => {
  const b = e.target.closest('button[data-ver]');
  if (!b || loadingVer) return;
  const ver = b.dataset.ver;
  if (ver === IMPORTED_VER && !importedView) return;
  if (ver === currentVer && loadedVer === ver) return;
  loadVersion(ver, {keepView: true});
});
loadCachedImport();
loadVersion('v2', {keepView: false});
</script>
